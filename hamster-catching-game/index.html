<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamster Catching Game 🐹</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-wrapper">
        <header class="game-header">
            <h1>🐹 Catch the Hamster!</h1>
            <p class="tagline">Click or tap the hamsters as fast as you can before they dive back into their holes!</p>
        </header>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-box">
                <span class="stat-label">SCORE</span>
                <span class="stat-val" id="score-val">0</span>
            </div>
            <div class="stat-box timer-box">
                <span class="stat-label">TIME LEFT</span>
                <span class="stat-val" id="time-val">30s</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">HIGH SCORE</span>
                <span class="stat-val" id="high-score-val">0</span>
            </div>
        </div>

        <!-- Controls Bar -->
        <div class="controls-bar">
            <button id="start-btn" class="btn btn-primary">▶ Start Game</button>
            <div class="difficulty-wrap">
                <label for="difficulty-select">Difficulty:</label>
                <select id="difficulty-select">
                    <option value="easy">Easy (Slow)</option>
                    <option value="medium" selected>Medium (Standard)</option>
                    <option value="hard">Hard (Fast!)</option>
                </select>
            </div>
            <button id="reset-btn" class="btn btn-secondary">Reset</button>
        </div>

        <!-- 3x3 Holes Grid -->
        <div class="holes-grid">
            <div class="hole" data-hole="0">
                <div class="hamster">
                    <div class="hamster-face">🐹</div>
                </div>
            </div>
            <div class="hole" data-hole="1">
                <div class="hamster">
                    <div class="hamster-face">🐹</div>
                </div>
            </div>
            <div class="hole" data-hole="2">
                <div class="hamster">
                    <div class="hamster-face">🐹</div>
                </div>
            </div>
            <div class="hole" data-hole="3">
                <div class="hamster">
                    <div class="hamster-face">🐹</div>
                </div>
            </div>
            <div class="hole" data-hole="4">
                <div class="hamster">
                    <div class="hamster-face">🐹</div>
                </div>
            </div>
            <div class="hole" data-hole="5">
                <div class="hamster">
                    <div class="hamster-face">🐹</div>
                </div>
            </div>
            <div class="hole" data-hole="6">
                <div class="hamster">
                    <div class="hamster-face">🐹</div>
                </div>
            </div>
            <div class="hole" data-hole="7">
                <div class="hamster">
                    <div class="hamster-face">🐹</div>
                </div>
            </div>
            <div class="hole" data-hole="8">
                <div class="hamster">
                    <div class="hamster-face">🐹</div>
                </div>
            </div>
        </div>

        <!-- Game Over Modal Overlay -->
        <div id="game-over-modal" class="modal-overlay" style="display: none;">
            <div class="modal-card">
                <h2>🎉 Game Over!</h2>
                <p>Your Final Score: <strong id="final-score" class="highlight-score">0</strong></p>
                <p id="high-score-msg" class="sub-msg">Well done!</p>
                <button id="play-again-btn" class="btn btn-primary">Play Again</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
